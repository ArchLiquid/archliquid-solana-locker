name: ArchLocker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILD_IMAGE: solanafoundation/solana-verifiable-build@sha256:f71be5ca7620b7e40933b7f1294fa44e01d08c1fc5ba1f375a2478f5a01580d3

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-08-16
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch locked SBF dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/archliquid-cargo"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/archliquid-cargo,dst=/cargo-home" \
            --env CARGO_HOME=/cargo-home \
            --env RUSTUP_TOOLCHAIN=1.86.0-x86_64-unknown-linux-gnu \
            --workdir /workspace \
            "$BUILD_IMAGE" cargo fetch --locked
      - name: Build immutable release candidate
        run: |
          mkdir -p target
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$PWD/target,dst=/build" \
            --mount "type=bind,src=$RUNNER_TEMP/archliquid-cargo,dst=/cargo-home" \
            --env CARGO_HOME=/cargo-home \
            --env CARGO_TARGET_DIR=/build/cargo-target \
            --env RUSTUP_TOOLCHAIN=1.86.0-x86_64-unknown-linux-gnu \
            --env HOME=/root \
            --env SOURCE_DATE_EPOCH=0 \
            --env TZ=UTC \
            --env LANG=C \
            --workdir /workspace \
            "$BUILD_IMAGE" cargo build-sbf --offline \
              --manifest-path programs/arch_locker/Cargo.toml \
              --sbf-out-dir /build/deploy -- --locked
          docker run --rm \
            --mount "type=bind,src=$PWD/target,dst=/build" \
            --entrypoint /bin/chown \
            "$BUILD_IMAGE" -R "$(id -u):$(id -g)" /build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/verify-release.test.mjs

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-08-16
        with:
          toolchain: 1.94.1
      - run: cargo install cargo-audit --version 0.22.0 --locked
      - run: cargo audit --deny warnings --ignore RUSTSEC-2021-0139 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2025-0161 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0097
