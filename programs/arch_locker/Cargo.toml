[package]
name = "arch-locker"
version = "0.1.0"
description = "ArchLiquid-owned Solana liquidity asset locker"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "arch_locker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }

[dev-dependencies]
anchor-attribute-access-control = { workspace = true }
anchor-attribute-account = { workspace = true }
anchor-attribute-constant = { workspace = true }
anchor-attribute-error = { workspace = true }
anchor-attribute-event = { workspace = true }
anchor-attribute-program = { workspace = true }
anchor-derive-accounts = { workspace = true }
anchor-derive-serde = { workspace = true }
anchor-derive-space = { workspace = true }
anchor-syn = { workspace = true }
litesvm = "=0.9.1"
solana-account = "3"
solana-keypair = "3"
solana-message = "3"
solana-program-option = "3"
solana-program-pack = "3"
solana-signer = "3"
solana-transaction = "3"
spl-token-interface = "2"

[lints]
workspace = true
